spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:/data/h2/turns
    username: sa
    password: ""

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        show_sql: true
        format_sql: false

    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  h2:
    console:
      enabled: true
      path: /h2-console

