version: '3'
services:
  back:
    build:
      dockerfile: DockerfileBack
    container_name: back
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Usar perfil prod (usa application-prod.yml con H2 en /data/h2)
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      # Carpeta local para persistir la base H2
      - ./db_data:/data/h2
    networks:
      - my_network

  front:
    build:
      dockerfile: DockerfileFront
    container_name: front
    restart: always
    ports:
      - 80:80
    expose:
      - 80
    depends_on:
      - back
    networks:
      - my_network

networks:
  my_network:
    driver: bridge